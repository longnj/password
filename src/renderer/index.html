<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PassVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 登录页 -->
<div id="login-page" class="page active">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3zm0 10a2 2 0 0 1 1 3.72V18a1 1 0 0 1-2 0v-1.28A2 2 0 0 1 12 13z"/></svg>
    </div>
    <h2 id="login-title">欢迎回来</h2>
    <p class="subtitle" id="login-subtitle">输入主密码以解锁你的密码库</p>
    <div class="input-group">
      <label>主密码</label>
      <div class="password-input-wrap">
        <input type="password" class="input-field" id="login-password" placeholder="••••••••••••">
        <button class="toggle-btn" onclick="togglePasswordField('login-password', this)">👁</button>
      </div>
    </div>
    <div id="first-time-section" style="display:none;">
      <div class="input-group">
        <label>确认主密码</label>
        <div class="password-input-wrap">
          <input type="password" class="input-field" id="login-confirm" placeholder="再次输入主密码">
        </div>
      </div>
      <p class="warning-text">⚠ 主密码无法找回，请务必牢记！忘记 = 密码库永久无法解密。</p>
    </div>
    <button class="btn-primary" id="login-btn" onclick="handleLogin()">解锁密码库</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-import-row">
      <button class="btn-text" onclick="showImportDialog()">从备份文件导入</button>
    </div>
  </div>
</div>

<!-- 主界面 -->
<div id="main-page" class="page">
  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">🔐 PassVault</span>
        <button class="icon-btn" onclick="lockApp()" title="锁定">🔒</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">分类</div>
        <div class="sidebar-item active" data-category="all">📂 全部 <span class="item-count" id="count-all">0</span></div>
        <div class="sidebar-item" data-category="工作">💼 工作 <span class="item-count" id="count-工作">0</span></div>
        <div class="sidebar-item" data-category="个人">🏠 个人 <span class="item-count" id="count-个人">0</span></div>
        <div class="sidebar-item" data-category="金融">💳 金融 <span class="item-count" id="count-金融">0</span></div>
        <div class="sidebar-item" data-category="娱乐">🎮 娱乐 <span class="item-count" id="count-娱乐">0</span></div>
        <div class="sidebar-item" data-category="favorite">⭐ 收藏 <span class="item-count" id="count-favorite">0</span></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">操作</div>
        <div class="sidebar-item" onclick="exportData()">📤 导出备份</div>
        <div class="sidebar-item" onclick="showImportDialog()">📥 导入</div>
        <div class="sidebar-item" onclick="showSettings()">⚙️ 设置</div>
      </div>
    </aside>

    <main class="main-content">
      <div class="main-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="搜索账号、网址或用户名…" oninput="renderEntries()">
        </div>
        <button class="btn-add" onclick="openEditModal()">+ 添加密码</button>
      </div>
      <div class="password-list" id="password-list"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-icon">📋</div>
        <p>还没有保存任何密码</p>
        <button class="btn-add" onclick="openEditModal()">+ 添加第一个密码</button>
      </div>
      <div class="status-bar">
        <span class="status-dot"></span>
        <span>已解锁 · 数据本地加密存储</span>
        <span style="margin-left:auto;" id="status-info">0 条密码</span>
      </div>
    </main>
  </div>
</div>

<!-- 编辑弹窗 -->
<div id="edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <h3 id="edit-modal-title">添加新密码</h3>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="input-group">
        <label>名称 *</label>
        <input type="text" class="input-field" id="edit-name" placeholder="例如：GitHub">
      </div>
      <div class="input-group">
        <label>网址</label>
        <input type="text" class="input-field" id="edit-url" placeholder="https://…">
      </div>
      <div class="field-row">
        <div class="input-group">
          <label>用户名 / 邮箱</label>
          <input type="text" class="input-field" id="edit-username" placeholder="your@email.com">
        </div>
        <div class="input-group">
          <label>分类</label>
          <select class="input-field" id="edit-category">
            <option value="工作">工作</option>
            <option value="个人">个人</option>
            <option value="金融">金融</option>
            <option value="娱乐">娱乐</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label>密码</label>
        <div class="field-row">
          <input type="password" class="input-field" id="edit-password" placeholder="••••••••" style="flex:1;">
          <button class="gen-btn" onclick="togglePasswordField('edit-password', this)">👁</button>
          <button class="gen-btn" onclick="fillGeneratedPassword()">🎲 生成</button>
        </div>
      </div>
      <div class="input-group">
        <label>备注</label>
        <textarea class="input-field" id="edit-notes" rows="3" placeholder="可选：备份恢复码、安全问题等"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeEditModal()">取消</button>
      <button class="btn-save" onclick="saveEntry()">保存密码</button>
    </div>
  </div>
</div>

<!-- 密码生成器弹窗 -->
<div id="generator-modal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3>密码生成器</h3>
      <button class="modal-close" onclick="closeGeneratorModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="gen-output">
        <div class="gen-output-field" id="gen-output">点击下方按钮生成</div>
        <button class="gen-copy-btn" onclick="copyGenerated()">📋</button>
      </div>
      <div class="gen-strength">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0;"></div></div>
        <div class="strength-label" id="strength-label">强度：—</div>
      </div>
      <div class="gen-control">
        <div class="gen-control-label">
          <span>密码长度</span>
          <span class="length-value" id="length-value">18</span>
        </div>
        <input type="range" class="gen-slider" min="8" max="64" value="18" id="gen-length" oninput="updateGenLength(this.value)">
      </div>
      <div class="gen-options">
        <div class="gen-option"><input type="checkbox" id="opt-upper" checked onchange="regenerate()"><label for="opt-upper">大写字母 A-Z</label></div>
        <div class="gen-option"><input type="checkbox" id="opt-lower" checked onchange="regenerate()"><label for="opt-lower">小写字母 a-z</label></div>
        <div class="gen-option"><input type="checkbox" id="opt-num" checked onchange="regenerate()"><label for="opt-num">数字 0-9</label></div>
        <div class="gen-option"><input type="checkbox" id="opt-sym" checked onchange="regenerate()"><label for="opt-sym">特殊符号 !@#$</label></div>
      </div>
      <button class="gen-regenerate" onclick="regenerate()">🔄 重新生成</button>
      <div class="gen-actions">
        <button class="btn-secondary" onclick="closeGeneratorModal()">关闭</button>
        <button class="btn-save" onclick="useGeneratedPassword()">使用此密码</button>
      </div>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h3>设置</h3>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="modal-body">
      <h4 style="margin-bottom:12px;color:var(--text-dim);font-size:14px;">修改主密码</h4>
      <div class="input-group">
        <label>当前主密码</label>
        <input type="password" class="input-field" id="settings-old-pw" placeholder="当前主密码">
      </div>
      <div class="input-group">
        <label>新主密码</label>
        <input type="password" class="input-field" id="settings-new-pw" placeholder="新主密码">
      </div>
      <div class="input-group">
        <label>确认新主密码</label>
        <input type="password" class="input-field" id="settings-confirm-pw" placeholder="再次输入新主密码">
      </div>
      <div class="settings-error" id="settings-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeSettings()">取消</button>
      <button class="btn-save" onclick="changeMasterPassword()">修改</button>
    </div>
  </div>
</div>

<!-- 导入弹窗 -->
<div id="import-modal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h3>导入密码库</h3>
      <button class="modal-close" onclick="closeImport()">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:16px;">选择之前导出的加密备份文件，并输入该文件的主密码。导入将<strong style="color:var(--warning)">覆盖</strong>当前密码库。</p>
      <div class="input-group">
        <label>主密码</label>
        <input type="password" class="input-field" id="import-password" placeholder="备份文件的主密码">
      </div>
      <div class="import-error" id="import-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeImport()">取消</button>
      <button class="btn-save" onclick="performImport()">选择文件并导入</button>
    </div>
  </div>
</div>

<!-- Toast 通知 -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
